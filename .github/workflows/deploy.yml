name: Deploy GoodGame Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: goodgame-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Typecheck and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_BACKEND_URL: ""
        run: npm run build

      - name: Typecheck web worker
        run: pnpm --filter web exec tsc --noEmit

      - name: Test GG address and token balance validation
        run: node --test scripts/gg.test.mjs scripts/mission.test.mjs scripts/article-content.test.mjs scripts/community-bot.test.mjs

      - name: Compute build time
        id: meta
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Apply only this additive, idempotent schema. Historical migrations include
      # catalog resets and must never be blindly replayed on production.
      - name: Ensure hosted community bot tables
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute goodgame --remote --file=migrations/0013_community_bot.sql

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web exec wrangler deploy --var BUILD_SHA:${{ github.sha }} --var BUILD_REF:${{ github.ref_name }} --var BUILD_TIME:${{ steps.meta.outputs.time }}
